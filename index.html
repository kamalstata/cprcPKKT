<title>Dashboard CPRC PKK Tuaran</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: operations-room board. Upload strip, sticky filter strip, KPI row, then one band per CPRC report section. */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface-2:#eaf0f0; --ink:#0d1b1e; --ink-2:#47585c; --muted:#7c8b8e;
  --line:#dbe3e3; --axis:#bfcaca; --accent:#0f6b78; --accent-ink:#ffffff; --accent-soft:#d7ecee;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --neutral:#a7b2b3;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#0a6b0a; --warn-ink:#8a5a00; --crit-ink:#a52828;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1416; --surface:#142023; --surface-2:#1b2a2e; --ink:#e9f0f0; --ink-2:#b4c2c4; --muted:#7f9093;
  --line:#25363a; --axis:#36494d; --accent:#3fb3c2; --accent-ink:#06191c; --accent-soft:#163a40;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --neutral:#5d6d70;
  --good-ink:#4fd04f; --warn-ink:#fab219; --crit-ink:#f07a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1416; --surface:#142023; --surface-2:#1b2a2e; --ink:#e9f0f0; --ink-2:#b4c2c4; --muted:#7f9093;
  --line:#25363a; --axis:#36494d; --accent:#3fb3c2; --accent-ink:#06191c; --accent-soft:#163a40;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --neutral:#5d6d70;
  --good-ink:#4fd04f; --warn-ink:#fab219; --crit-ink:#f07a7a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:16px 14px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.5vw,38px);line-height:1.05;margin:2px 0 0;text-wrap:balance}
.meta{color:var(--ink-2);font-size:13px}
.meta b{color:var(--ink)}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.lang button{font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.04em;border:0;background:none;color:var(--ink-2);padding:5px 12px;border-radius:999px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* upload strip */
.upload{background:var(--surface-2);border-bottom:1px solid var(--line)}
.upload .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.upload.drag{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-6px}
.btn{font:inherit;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:8px 14px;min-height:38px;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:var(--axis)}
.btn svg{width:16px;height:16px;flex:none}
#fileIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#fileIn:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.upinfo{display:flex;flex-direction:column;min-width:0;flex:1 1 260px;font-size:12.5px;color:var(--ink-2)}
.upinfo b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.upinfo .hint{font-size:11.5px;color:var(--muted)}
.upmsg{font-size:12.5px;font-weight:600}
.upmsg.err{color:var(--crit-ink)} .upmsg.ok{color:var(--good-ink)} .upmsg.warnm{color:var(--warn-ink)}

/* filter strip */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 4px 14px -10px rgba(0,0,0,.25)}
.filters .wrap{padding-block:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center}
.rangebox{min-width:0}
.rangelabel{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:2px}
.rangelabel strong{color:var(--ink);font-size:14px;text-align:right}
.range{position:relative;height:34px}
.range .track{position:absolute;left:11px;right:11px;top:15px;height:4px;border-radius:2px;background:var(--line)}
.range .fill{position:absolute;top:15px;height:4px;border-radius:2px;background:var(--accent)}
.range .ticks{position:absolute;left:11px;right:11px;top:22px;height:6px}
.range .ticks i{position:absolute;width:1px;height:5px;background:var(--axis)}
.range input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;height:34px}
.range input::-webkit-slider-runnable-track{background:none;height:34px}
.range input::-moz-range-track{background:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;margin-top:6px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent);cursor:grab}
.range input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.sel{display:flex;flex-direction:column;font-size:11px;color:var(--ink-2);gap:2px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
select{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 30px 7px 10px;min-height:38px;max-width:100%;
  -webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.jump{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
nav.jump::-webkit-scrollbar{display:none}
nav.jump a{flex:none;text-decoration:none;color:var(--ink-2);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
nav.jump a:hover{color:var(--ink);border-color:var(--axis)}

main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:26px}
section{scroll-margin-top:140px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:10px}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;line-height:1.1;letter-spacing:.01em}
h2 small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-right:8px;vertical-align:3px}
.sechead p{margin:0;color:var(--ink-2);font-size:13px;max-width:62ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{font-size:13.5px;font-weight:700;margin:0 0 2px}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.chart{position:relative;height:260px}
.chart.short{height:200px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;overflow:hidden}
.kpi .lab{font-size:11.5px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
.kpi .foot{font-size:12px;color:var(--muted)}
.kpi.flag{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.kpi.flag::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--crit)}
.delta{font-weight:700}
.delta.up{color:var(--crit-ink)} .delta.down{color:var(--good-ink)} .delta.flat{color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.pill.crit{color:var(--crit-ink);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.pill.info{color:var(--ink-2);background:var(--surface-2)}

.ob{display:flex;flex-direction:column;gap:8px}
.ob .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ob .name{font-weight:700;font-size:15px}
.ob .loc{font-size:12.5px;color:var(--ink-2)}
.ob dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.ob dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ob dd{margin:0;font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.ob dd.sm{font-family:var(--body);font-size:13px;font-weight:600;padding-top:4px}
.ob .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ob .bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.ob .note{font-size:12px;color:var(--ink-2)}

.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td .mini{display:inline-block;height:6px;border-radius:3px;background:var(--s2);vertical-align:middle;margin-left:6px}
.muted{color:var(--muted)}
.loclist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.loclist li{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.loclist .lbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface-2);margin-top:-3px}
.loclist .lbar span{display:block;height:100%;background:var(--s1);border-radius:3px}
.loclist b{text-align:right;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink);margin-bottom:10px}
.banner b{color:var(--warn-ink)}
.issues{display:flex;flex-direction:column}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .t{font-weight:600}
.issue .d{grid-column:2;font-size:12.5px;color:var(--ink-2)}
.issue .w{grid-column:2;font-size:11.5px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--ink-2)}
.empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
footer{color:var(--muted);font-size:12px;padding-block:0 30px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* stock bullets */
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px}
.cardhead > div{min-width:0}
.bullets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 26px;margin:4px 0 6px}
.bl{display:flex;flex-direction:column;gap:5px;min-width:0}
.bl .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.bl .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.bl .vv{font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bl .trk{position:relative;height:12px;border-radius:4px;background:var(--surface-2)}
.bl .trk .f{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s3);min-width:2px}
.bl .trk .f.low{background:var(--warn)}
.bl .trk .f.zero{background:transparent}
.bl .trk .m{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.bl .trk .m.est{background:repeating-linear-gradient(var(--ink) 0 3px,transparent 3px 5px)}
.bl .foot2{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.keyrow{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-2);margin:2px 0 12px}
.keyrow span{display:inline-flex;align-items:center;gap:6px}
.keyrow i{display:inline-block}
.keyrow i.kb{width:16px;height:8px;border-radius:2px;background:var(--s3)}
.keyrow i.kl{width:16px;height:8px;border-radius:2px;background:var(--warn)}
.keyrow i.km{width:2px;height:14px;background:var(--ink)}
.keyrow i.ke{width:2px;height:14px;background:repeating-linear-gradient(var(--ink) 0 3px,transparent 3px 5px)}
.subgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;margin-top:10px;border-top:1px solid var(--line);padding-top:14px}
.subgrid h4{font-size:13px;margin:0;font-weight:700}
input.min{font:inherit;font-size:13px;width:90px;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);text-align:right}
input.min:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.src{display:block;font-size:10.5px;color:var(--muted);text-align:right}
.chart.dyn{height:auto}
.tbl.scroll{max-height:440px;overflow:auto}
.tbl.scroll th{position:sticky;top:0;background:var(--surface);z-index:1}
/* landing */
.landing .wrap{padding-block:32px 48px}
.lcard{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px;display:flex;flex-direction:column;gap:16px}
.lcard h2{font-size:30px}
.lcard .lead{margin:0;color:var(--ink-2);font-size:14.5px;max-width:60ch}
.lcard .lead code{font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.dropzone{border:2px dashed var(--axis);border-radius:14px;background:var(--surface-2);min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px;text-align:center;transition:background .15s,border-color .15s}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.dropzone svg.big{width:44px;height:44px;color:var(--accent)}
.dropzone .dz1{font-weight:700;font-size:16px}
.dropzone .dz2{color:var(--muted);font-size:12.5px}
.lcard .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
.chips span.req{border-color:var(--accent);color:var(--ink)}
.lcard h3{font-size:13px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.lcard .small{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.upmsg:empty{display:none}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .g2,.g21,.subgrid{grid-template-columns:minmax(0,1fr)}
  .filters{position:static}
  .filters .wrap{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:32px}
  .chart{height:230px}
  section{scroll-margin-top:16px}
  .ob dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hright{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <div>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1>Dashboard CPRC PKK Tuaran</h1>
  </div>
  <div class="hright">
    <div class="lang" role="group" aria-label="Bahasa / Language">
      <button type="button" id="langMs" aria-pressed="true">BM</button>
      <button type="button" id="langEn" aria-pressed="false">EN</button>
    </div>
    <div class="meta" id="meta" hidden></div>
  </div>
</div></header>

<input type="file" id="fileIn" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
<div class="landing" id="landing"><div class="wrap">
  <div class="lcard">
    <div>
      <div class="eyebrow" data-i18n="landStep"></div>
      <h2 data-i18n="landTitle"></h2>
    </div>
    <p class="lead" id="landLead"></p>
    <div class="dropzone" id="dropzone">
      <svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/><path d="M12 17v-6M9.5 13.5 12 11l2.5 2.5"/></svg>
      <div class="dz1" data-i18n="landDrop"></div>
      <div class="dz2" data-i18n="landOr"></div>
      <label for="fileIn" class="btn primary"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 10.5v3h11v-3"/></svg><span data-i18n="landChoose"></span></label>
      <div class="dz2" data-i18n="upPrivacyFull"></div>
    </div>
    <div class="upmsg" id="landMsg" role="status" aria-live="polite"></div>
    <div class="row">
      <button type="button" class="btn ghost" id="btnLast" hidden></button>
    </div>
    <div>
      <h3 data-i18n="landNeeds"></h3>
      <p class="small" data-i18n="landNeedsSub"></p>

const DATE_COL = /^(Tarikh|Servis|Jangka)/;
function serialToISO(n){ const ms=Math.round((n-25569)*864e5); const d=new Date(ms); return isNaN(d)?null:d.toISOString().slice(0,10); }
function normDate(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return (v>20000&&v<80000)? serialToISO(v) : v;
  if(v instanceof Date) return isNaN(v)?null:new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())).toISOString().slice(0,10);
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return s;
}
/* aoaOf(name) -> array of arrays (header:1). Kept separate so the parser does not depend on the reader library. */
function buildData(aoaOf, sheetNames){
  const D={}, missing=[];
  for(const [key,[sheet,keyCol]] of Object.entries(SHEETS)){
    const real = sheetNames.find(n=>n.trim().toLowerCase()===sheet.toLowerCase());
    if(!real){ D[key]=[]; missing.push(sheet); continue; }
    const aoa = aoaOf(real)||[];
    let h = -1;
    for(let i=0;i<Math.min(8,aoa.length);i++){ if((aoa[i]||[]).some(c=>String(c??'').trim()===keyCol)){ h=i; break; } }
    if(h<0){ D[key]=[]; missing.push(sheet); continue; }
    const head = aoa[h].map(c=>String(c??'').trim());
    const rows=[];
    for(let i=h+1;i<aoa.length;i++){
      const r=aoa[i]||[]; const o={}; let any=false;
      head.forEach((c,j)=>{ if(!c) return; let v=r[j]; if(v===undefined||v==='') v=null; if(typeof v==='string'){ v=v.trim(); if(v==='') v=null; }
        if(v!==null && DATE_COL.test(c) && !/Seperti_PDF/.test(c)) v=normDate(v);
        o[c]=v; if(v!==null) any=true; });
      if(any && o[keyCol]!==null && o[keyCol]!==undefined) rows.push(o);
    }
    D[key]=rows;
  }
  // derived / fallbacks
  D.bat.forEach(b=>{ if(num(b.Hari_Tertunggak)===null && /^\d{4}-/.test(b.Tarikh_Laporan||'') && /^\d{4}-/.test(b.Tarikh_Notifikasi||'')) b.Hari_Tertunggak=dayDiff(b.Tarikh_Laporan,b.Tarikh_Notifikasi); });
  D.kenderaan.forEach(k=>{ if(num(k.Hari_Lewat_Servis)===null && /^\d{4}-/.test(k.Tarikh_Laporan||'') && /^\d{4}-/.test(k.Servis_Seterusnya||'')) k.Hari_Lewat_Servis=dayDiff(k.Tarikh_Laporan,k.Servis_Seterusnya); });
  const ds = new Set(D.ringkasan.map(r=>r.Tarikh_Laporan).filter(d=>/^\d{4}-/.test(d||'')));
  if(!ds.size) D.notif.forEach(r=>{ if(/^\d{4}-/.test(r.Tarikh_Laporan||'')) ds.add(r.Tarikh_Laporan); });
  D.dates=[...ds].sort();
  D.ringkasan.sort((a,b)=>a.Tarikh_Laporan<b.Tarikh_Laporan?-1:1);
  return {D, missing};
}
function epiWeek(iso){ // fallback: weeks start Sunday, week 1 starts on the year's first Sunday

}

  D.notif.forEach(r=>{ if(!r.Penyakit) return; tot[r.Penyakit]=(tot[r.Penyakit]||0)+(num(r.Jum_Diterima)||0); groupOf[r.Penyakit]=r.Kumpulan; });
  diseaseList=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
  if(S.disease!=='__all' && !diseaseList.includes(S.disease)) S.disease='__all';
}

function msg(text, cls){ ['upMsg','landMsg'].forEach(id=>{ const m=$(id); m.textContent=text||''; m.className='upmsg'+(cls?' '+cls:''); }); }
function handleFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ msg(t('upErrLib'),'err'); return; }
  msg(t('upLoading'));
  const fr=new FileReader();
  fr.onerror=()=>msg(t('upErrRead'),'err');
  fr.onload=()=>{
    let wb;
    try{ wb=XLSX.read(new Uint8Array(fr.result),{type:'array',cellDates:false}); }catch(e){ msg(t('upErrRead'),'err'); return; }
    const {D:nd, missing} = buildData(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:false}), wb.SheetNames);
    if(!nd.dates.length){ msg(t('upErrNoSheet'),'err'); return; }
    setData(nd, file.name);
    let saved=false;
    try{ localStorage.setItem('cprc-tuaran-data', JSON.stringify({name:file.name, D:nd})); saved=true; }catch(e){}
    const core=missing.filter(m=>m!=='Isu_Data');
    msg((core.length? t('upMissing', missing.join(', ')) : t('upOk')) + (saved?' '+t('upSaved'):''), core.length?'warnm':'ok');
  };
  fr.readAsArrayBuffer(file);
}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const charts={};
function chart(id,cfg){
  if(charts[id]){ charts[id].destroy(); delete charts[id]; }
  if(!cfg) return;
  const cv=$(id);
  if(typeof Chart==='undefined'){ cv.parentElement.setAttribute('data-nochart',''); cv.hidden=true; let n=cv.parentElement.querySelector('.empty'); if(!n){ n=document.createElement('div'); n.className='empty'; cv.parentElement.appendChild(n);} n.textContent=t('noChart'); return; }
  charts[id]=new Chart(cv,cfg);
}
function deepMerge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object') deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }
function baseOpts(extra){
  if(typeof Chart!=='undefined'){ Chart.defaults.font.family=getComputedStyle(document.body).fontFamily; Chart.defaults.color=css('--ink-2'); }
  return deepMerge({
    responsive:true, maintainAspectRatio:false, animation:{duration:250}, interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false}, tooltip:{backgroundColor:css('--ink'), titleColor:css('--bg'), bodyColor:css('--bg'), footerColor:css('--bg'), padding:10, cornerRadius:8, boxPadding:4}},
    scales:{ x:{grid:{display:false}, border:{color:css('--axis')}, ticks:{color:css('--muted'), maxRotation:0, autoSkipPadding:8, font:{size:11}}},
             y:{beginAtZero:true, grid:{color:css('--line')}, border:{display:false}, ticks:{color:css('--muted'), precision:0, font:{size:11}}} }
  }, extra||{});
}

/* ================= data helpers ================= */
const R = d => D.ringkasan.find(x=>x.Tarikh_Laporan===d)||{};
function diseaseSeries(p, ds){
  return ds.map(d=>{
    if(p==='__all'){ const v=num(R(d).Notifikasi_Diterima); if(v!==null) return v; const rs=D.notif.filter(x=>x.Tarikh_Laporan===d); return rs.length?sum(rs.map(x=>x.Jum_Diterima)):null; }
    const rs=D.notif.filter(x=>x.Tarikh_Laporan===d&&x.Penyakit===p); return rs.length? sum(rs.map(x=>x.Jum_Diterima)) : 0;
  });
}
function prevWindow(){ const n=S.i1-S.i0+1, a=S.i0-n; return a<0?null:dates.slice(a,S.i0); }
function deltaHtml(cur, prev){
  if(prev===null) return `<span class="muted">${esc(t('noCompare'))}</span>`;
  if(prev===0&&cur===0) return `<span class="delta flat">${esc(t('same'))}</span>`;
  const pct=prev===0?null:Math.round((cur-prev)/prev*100);
  const cls=cur>prev?'up':(cur<prev?'down':'flat'), ar=cur>prev?'▲':(cur<prev?'▼':'■');
  return `<span class="delta ${cls}">${ar} ${pct===null?'+'+(cur-prev):(pct>0?'+':'')+pct+'%'}</span> ${esc(t('vsPrev',prev))}`;
}

  const daf=sum(ds.map(d=>R(d).Kes_Daftar));
  const flu=sum(diseaseSeries('Influenza A',ds)), fluP=pw?sum(diseaseSeries('Influenza A',pw)):null;

  const denP=pw?sum(D.denggi.filter(r=>pw.includes(r.Tarikh_Laporan)).map(r=>r.Notifikasi_Diterima)):null;

    {lab:t('kReg'), val:daf, foot:esc(t('pctOf', tot?Math.round(daf/tot*100):0))},
    {lab:t('kFlu'), val:flu, foot:deltaHtml(flu,fluP), flag: fluP!==null && flu>fluP*1.2 && flu>=10},

function parseLocs(str){
  const out=[]; if(!str) return out;
  String(str).split(/[;,]/).forEach(x=>{ x=x.trim(); if(!x||x==='...') return; let n=1; const m=x.match(/\((\d+)\)\s*$/); if(m){ n=+m[1]; x=x.replace(/\((\d+)\)\s*$/,'').trim(); }
    const key=x.toLowerCase().replace(/\./g,' ').replace(/\b(kampung|kg)\b/g,'kg').replace(/\btmn\b/g,'taman').replace(/\s+/g,' ').trim(); if(key) out.push({key,label:x,n}); });
  return out;
}

function outbreaks(){

  rc.filter(r=>r.Status==='Selesai').forEach(r=>{ const a=num(r.Amaun_Racun); if(a===null) return; const u=String(r.Unit_Racun||'').toLowerCase(); const ml=u==='ml'?a:(u==='l'?a*1000:null);

    if(!used[name]) used[name]={ml:0,n:0,unk:0,wb:0}; used[name].n++; if(r.ID_Wabak) used[name].wb++; if(ml===null) used[name].unk+=a; else used[name].ml+=ml; });
  const ue=Object.entries(used).sort((a,b)=>b[1].ml-a[1].ml);
  $('racunTbl').innerHTML=ue.length?`<thead><tr><th>${t('thInsect')}</th><th class="num">${t('thRecords')}</th><th class="num">${t('thObArea')}</th><th class="num">${t('thTotal')}</th></tr></thead><tbody>`+
    ue.map(([k,x])=>`<tr><td>${esc(k)}</td><td class="num">${x.n}</td><td class="num">${x.wb}</td><td class="num" style="white-space:nowrap">${x.ml>=1000?(x.ml/1000).toFixed(2)+' L':x.ml+' ml'}${x.unk?` <span class="muted">+${x.unk} ${esc(t('noUnit'))}</span>`:''}</td></tr>`).join('')+'</tbody>'
    :`<tbody><tr><td class="empty">${esc(t('noDone'))}</td></tr></tbody>`;
}
const IDX={BI:['BI','idxBI'],AI:['AI_%','idxAI'],CI:['CI_%','idxCI']};
let ptpIdx='BI';
function fillIdxSel(){ $('selIdx').innerHTML=Object.entries(IDX).map(([k,v])=>`<option value="${k}">${esc(t(v[1]))}</option>`).join(''); $('selIdx').value=ptpIdx; }
$('selIdx').addEventListener('change',()=>{ ptpIdx=$('selIdx').value; renderPtpChart(D.ptp.filter(r=>inRange(r.Tarikh_Laporan))); });
function renderPtpChart(ptp){
  $('ptpSub').textContent=t('ptpSub2',ptp.length);
  const box=$('ptpBox'); box.style.height=Math.max(180, ptp.length*30+50)+'px';
  if(!ptp.length){ chart('cPtp',null); return; }
  const col=IDX[ptpIdx][0];
  const labels=ptp.map(r=>fmt(r.Tarikh_Aktiviti||r.Tarikh_Laporan)+' · '+String(r.Lokaliti_Seperti_PDF||'').replace(/\s+/g,' ').slice(0,30));
  const vals=ptp.map(r=>num(r[col]));
  chart('cPtp',{type:'bar',data:{labels,datasets:[{label:t(IDX[ptpIdx][1]),data:vals,backgroundColor:css('--s2'),borderRadius:{topRight:4,bottomRight:4},borderSkipped:'left',maxBarThickness:18}]},
    options:baseOpts({indexAxis:'y',interaction:{mode:'nearest',axis:'y',intersect:false},
      scales:{x:{grid:{display:true,color:css('--line')},beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false},ticks:{color:css('--ink-2'),font:{size:11}}}},
      plugins:{tooltip:{callbacks:{title:it=>ptp[it[0].dataIndex].Lokaliti_Seperti_PDF, label:c=>` ${t(IDX[ptpIdx][1])}: ${c.raw===null?t('noData'):c.raw}`,
        afterLabel:c=>{ const r=ptp[c.dataIndex]; return [r.Rumah_Dilawati!=null?t('houses',r.Rumah_Dilawati):null, r.Bekas_Positif!=null?t('posC',r.Bekas_Positif):null].filter(Boolean).join('\n'); }}}}})});
}
function renderLogistik(){
  if(!dates.length) return;
  const e=endDate(), s0=dates[S.i0], u=S.unit, uf=r=>u==='all'||r.Unit===u, all=u==='all';
  const aset=D.aset.filter(r=>r.Tarikh_Laporan===e&&uf(r)), aset0=D.aset.filter(r=>r.Tarikh_Laporan===s0&&uf(r));
  $('asetSub').textContent=t('asetSub',fmt(e),sum(aset.map(r=>r.Bil_Berfungsi)),sum(aset.map(r=>r.Bil_Rosak)));
  $('asetTbl').innerHTML=`<thead><tr><th>${t('thAsset')}</th>${all?`<th>${t('thUnit')}</th>`:''}<th class="num">${t('thOk')}</th><th class="num">${t('thBroken')}</th><th>${t('thStatus')}</th></tr></thead><tbody>`+
    aset.map(r=>{ const a0=aset0.find(x=>x.Aset_Seperti_PDF===r.Aset_Seperti_PDF&&x.Unit===r.Unit); const ch=a0&&(a0.Bil_Rosak!==r.Bil_Rosak||a0.Bil_Berfungsi!==r.Bil_Berfungsi)?` <span class="muted">(${fmt(s0)}: ${esc(a0.Bil_Berfungsi)}/${esc(a0.Bil_Rosak)})</span>`:'';
      const conflict=r.Catatan&&/bercanggah|sahkan/i.test(r.Catatan);
      return `<tr><td>${esc(r.Aset_Seperti_PDF)}${conflict?`<div class="muted" style="font-size:11.5px">${esc(r.Catatan)}</div>`:''}</td>${all?`<td>${esc(dv(r.Unit))}</td>`:''}<td class="num">${esc(r.Bil_Berfungsi??'–')}</td><td class="num">${esc(r.Bil_Rosak??'–')}${ch}</td><td>${(num(r.Bil_Rosak)||0)>0?`<span class="pill crit">${t('pBroken')}</span>`:(conflict?`<span class="pill warn">${t('pCheck')}</span>`:`<span class="pill good">${t('pOk')}</span>`)}</td></tr>`; }).join('')+'</tbody>';
  renderStock();
  const kd=D.kenderaan.filter(r=>r.Tarikh_Laporan===e).sort((a,b)=>(num(b.Hari_Lewat_Servis)||0)-(num(a.Hari_Lewat_Servis)||0));
  $('kendSub').textContent=t('kendSub',fmt(e),kd.length,kd.filter(r=>String(r.Status).toUpperCase()==='ROSAK').length,kd.filter(r=>(num(r.Hari_Lewat_Servis)||0)>0).length);
  $('kendTbl').innerHTML=`<thead><tr><th>${t('thPlate')}</th><th>${t('thModel')}</th><th>${t('thUnit')}</th><th>${t('thStatus')}</th><th>${t('thNext')}</th><th class="num">${t('thLate')}</th><th>${t('thNote')}</th></tr></thead><tbody>`+
    kd.map(r=>{ const l=num(r.Hari_Lewat_Servis)||0, bad=String(r.Status).toUpperCase()==='ROSAK';
      return `<tr><td style="white-space:nowrap"><b>${esc(r.No_Plat)}</b></td><td>${esc(r.Model)}</td><td>${esc(r.Unit)}</td><td>${bad?`<span class="pill crit">${t('pBad')}</span>`:`<span class="pill good">${t('pGood')}</span>`}</td><td style="white-space:nowrap">${esc(fmtY(r.Servis_Seterusnya))}</td><td class="num">${l>0?`<span class="pill ${l>90?'crit':'warn'}">${esc(t('daysN',l))}</span>`:`<span class="muted">${t('notDue')}</span>`}</td><td style="min-width:200px">${esc(r.Catatan_PDF)}</td></tr>`; }).join('')+'</tbody>';
}
/* ---- stock ---- */
const UNIT_N = u => { u=String(u||'').toLowerCase().trim(); if(!u||u==='(tiada unit)'||u==='unit') return ''; if(/^(l|liter|litre|ltr)$/.test(u)) return 'L'; if(u==='gm'||u==='g') return 'g'; return u; };
function qty(r){
  let v=num(r.Baki), u=r.Unit_Ukuran;
  const txt=String(r.Baki_Seperti_PDF??'').trim();
  if(v===null){ const m=txt.match(/^(\d+(?:[.,]\d+)?)\s*([A-Za-z]+)?/); if(!m) return null; if(/\d\s*[A-Za-z]+\s*[, ]+\s*\d/.test(txt)) return {v:null,u:'',txt,mixed:true}; v=+m[1].replace(',','.'); u=m[2]||''; }
  return {v, u:UNIT_N(u), txt};
}
let MINS={}; try{ MINS=JSON.parse(localStorage.getItem('cprc-tuaran-min')||'{}')||{}; }catch(e){ MINS={}; }
const saveMins=()=>{ try{ localStorage.setItem('cprc-tuaran-min',JSON.stringify(MINS)); }catch(e){} };
const fmtQ=(v,u)=> v===null?'–':(Math.round(v*100)/100).toLocaleString(LANG==='en'?'en-GB':'ms-MY')+(u?(u==='L'||u==='g'||u==='kg'?' ':' ')+u:'');
function stockItems(){
  const u=S.unit, e=endDate();
  const rows=D.stok.filter(r=>(u==='all'||r.Unit===u)&&r.Tarikh_Laporan<=e);
  const keys=[...new Set(rows.map(r=>r.Unit+'|'+r.Item_Seperti_PDF))];
  return keys.map(key=>{
    const [un,it]=key.split('|');
    const hist=rows.filter(r=>r.Unit===un&&r.Item_Seperti_PDF===it).sort((a,b)=>a.Tarikh_Laporan<b.Tarikh_Laporan?-1:1);
    const lastRow=hist[hist.length-1]; const cur=qty(lastRow)||{v:null,u:'',txt:lastRow.Baki_Seperti_PDF};
    const present=lastRow.Tarikh_Laporan===e;
    if(cur.v===0){ const nz=[...hist].reverse().map(r=>qty(r)).find(q=>q&&q.v); if(nz) cur.u=nz.u; }
    const same=q=>q&&q.v!==null&&(q.u===cur.u||q.v===0);
    const vals=hist.map(r=>qty(r)).filter(same).map(q=>q.v);
    const max=vals.length?Math.max(...vals):0;
    const unitChanged=hist.some(r=>{ const q=qty(r); return q&&q.v!==null&&q.v!==0&&cur.v!==0&&q.u!==cur.u; })||!!cur.mixed;
    let min=null, src=null;
    const fm=[...hist].reverse().map(r=>num(r.Paras_Minimum)).find(x=>x!==null&&x!==undefined);
    if(fm!=null){ min=fm; src='file'; }
    else if(MINS[key]!=null&&MINS[key]!==''){ min=+MINS[key]; src='user'; }
    else if(max>0){ min=Math.round(max*0.25*100)/100; src='est'; }
    let status='ok'; if(cur.v===0) status='zero'; else if(cur.v!==null&&min!==null&&cur.v<min) status='low'; else if(cur.v===null) status='na';
    return {key,un,it,hist,cur,max,min,src,status,unitChanged,present};
  }).filter(x=>x.present);
}
function renderStock(){
  const e=endDate(), s0=dates[S.i0], all=S.unit==='all';
  const items=stockItems();
  $('stokSub').textContent=t('stokSub2',fmt(e));
  if(!items.length){ $('stokBullets').innerHTML=`<div class="empty">${esc(t('noStock'))}</div>`; $('stokTbl').innerHTML=''; $('selItem').innerHTML=''; chart('cStok',null); return; }
  const order={zero:0,low:1,ok:2,na:3};
  const sorted=[...items].sort((a,b)=>order[a.status]-order[b.status]);
  const pill=x=> x.status==='zero'?`<span class="pill crit">${t('pEmpty')}</span>`: x.status==='low'?`<span class="pill warn">${t('pLow')}</span>`: x.status==='ok'?`<span class="pill good">${t('pOkStock')}</span>`:`<span class="pill info">${t('noData')}</span>`;
  $('stokBullets').innerHTML=sorted.map(x=>{
    const scale=Math.max(x.max, x.min||0, x.cur.v||0)*1.1 || 1;
    const w=x.cur.v===null?0:Math.min(100,x.cur.v/scale*100), m=x.min!==null?Math.min(100,x.min/scale*100):null;
    return `<div class="bl"><div class="top"><span class="nm">${esc(x.it)}${all?` <span class="muted" style="font-weight:400">· ${esc(dv(x.un))}</span>`:''}</span><span class="vv">${x.cur.v===null?esc(x.cur.txt):esc(fmtQ(x.cur.v,x.cur.u))} ${pill(x)}</span></div>
      <div class="trk" role="img" aria-label="${esc(x.it)}: ${esc(fmtQ(x.cur.v,x.cur.u))}${x.min!==null?' / '+esc(t('minLbl',fmtQ(x.min,x.cur.u))):''}"><span class="f${x.status==='low'?' low':''}${x.cur.v===0?' zero':''}" style="width:${w}%"></span>${m!==null?`<span class="m${x.src==='est'?' est':''}" style="left:${m}%"></span>`:''}</div>
      <div class="foot2"><span>${x.min!==null?esc(t('minLbl',fmtQ(x.min,x.cur.u)))+' ('+esc(t(x.src==='file'?'srcFile':x.src==='user'?'srcUser':'srcEst'))+')':''}</span><span>${x.unitChanged?esc(t('unitChanged')):esc(t('maxLbl',fmtQ(x.max,x.cur.u)))}</span></div></div>`; }).join('');
  // item dropdown + trend
  const sel=$('selItem'); const prev=sel.value;
  sel.innerHTML=sorted.map(x=>`<option value="${esc(x.key)}">${esc(x.it)}${all?' · '+esc(dv(x.un)):''}</option>`).join('');
  sel.value=sorted.some(x=>x.key===prev)?prev:sorted[0].key;
  renderStockTrend(items);
  // min table
  const st0=D.stok.filter(r=>r.Tarikh_Laporan===s0);
  $('stokTbl').innerHTML=`<thead><tr><th>${t('thItem')}</th><th class="num">${fmt(s0)}</th><th class="num">${fmt(e)}</th><th class="num">${t('thMin')}</th></tr></thead><tbody>`+
    sorted.map((x,i)=>{ const a=st0.find(r=>r.Unit===x.un&&r.Item_Seperti_PDF===x.it); const av=a?(a.Baki_Seperti_PDF??a.Baki??'–'):'–';
      const ro=x.src==='file';
      return `<tr><td>${esc(x.it)}${all?`<div class="muted" style="font-size:11.5px">${esc(dv(x.un))}</div>`:''}</td><td class="num">${esc(av)}</td><td class="num">${esc(x.cur.txt)}</td>
        <td class="num"><input class="min" type="number" min="0" step="any" inputmode="decimal" id="min-${i}-${esc(x.key.replace(/[^A-Za-z0-9]/g,''))}" data-key="${esc(x.key)}" value="${x.src==='user'||x.src==='file'?x.min:''}" placeholder="${x.src==='est'?esc(String(x.min)):''}" ${ro?'disabled':''} aria-label="${esc(t('thMin'))} ${esc(x.it)}"><span class="src">${x.cur.u?esc(x.cur.u)+' · ':''}${esc(t(x.src==='file'?'srcFile':x.src==='user'?'srcUser':'srcEst'))}</span></td></tr>`; }).join('')+'</tbody>';
}
function renderStockTrend(items){
  items=items||stockItems();
  const x=items.find(i=>i.key===$('selItem').value); if(!x){ chart('cStok',null); return; }
  const ds=rangeDates();
  const vals=ds.map(d=>{ const r=x.hist.find(h=>h.Tarikh_Laporan===d); const q=r&&qty(r); return q&&q.v!==null&&(q.u===x.cur.u||q.v===0)?q.v:null; });
  const sets=[{type:'bar',label:t('balance'),data:vals,backgroundColor:vals.map(v=>v!==null&&x.min!==null&&v<x.min?css('--warn'):css('--s3')),borderRadius:{topLeft:4,topRight:4},borderSkipped:'bottom',maxBarThickness:26,order:2}];
  if(x.min!==null) sets.push({type:'line',label:t('minLine')+(x.src==='est'?' ('+t('srcEst')+')':''),data:ds.map(()=>x.min),borderColor:css('--ink'),borderWidth:2,borderDash:x.src==='est'?[5,4]:[],pointRadius:0,pointHoverRadius:0,order:1});
  chart('cStok',{type:'bar',data:{labels:ds.map(fmt),datasets:sets},
    options:baseOpts({plugins:{legend:{display:true,position:'top',align:'start',labels:{boxWidth:14,boxHeight:8,color:css('--ink-2')}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.raw===null?t('noData'):fmtQ(c.raw,x.cur.u)}`}}},
      scales:{y:{ticks:{precision:undefined,callback:v=>fmtQ(v,x.cur.u)}}}})});
}
$('selItem').addEventListener('change',()=>renderStockTrend());
document.addEventListener('change',e=>{ const el=e.target; if(!el.classList||!el.classList.contains('min')) return; const k=el.dataset.key; const v=el.value.trim();
  if(v===''||isNaN(+v)||+v<0) delete MINS[k]; else MINS[k]=+v; saveMins(); renderStock(); });

function renderBAT(){
  const ds=rangeDates();
  chart('cBat',{type:'line',data:{labels:ds.map(fmt),datasets:[
      {label:t('batTotal'),data:ds.map(d=>D.bat.filter(b=>b.Tarikh_Laporan===d).length),borderColor:css('--s1'),backgroundColor:css('--s1'),borderWidth:2,pointRadius:3,pointHoverRadius:5,tension:.25},
      {label:t('batOver'),data:ds.map(d=>D.bat.filter(b=>b.Tarikh_Laporan===d&&(num(b.Hari_Tertunggak)||0)>7).length),borderColor:css('--crit'),backgroundColor:css('--crit'),borderWidth:2,pointRadius:3,pointHoverRadius:5,tension:.25}]},
    options:baseOpts({})});
  const e=endDate(), list=D.bat.filter(b=>b.Tarikh_Laporan===e).sort((a,b)=>(num(b.Hari_Tertunggak)||0)-(num(a.Hari_Tertunggak)||0));
  $('batTitle').textContent=t('batTitle',fmt(e),list.length);
  $('batTbl').innerHTML=list.length?`<thead><tr><th>${t('disease')}</th><th>${t('thNotifDate')}</th><th>${t('thLab')}</th><th class="num">${t('thDays')}</th></tr></thead><tbody>`+
    list.map(b=>{ const h=num(b.Hari_Tertunggak); return `<tr><td>${esc(dv(b.Penyakit))}</td><td style="white-space:nowrap">${esc(fmt(b.Tarikh_Notifikasi))}</td><td>${esc(dv(b.Keputusan_Makmal)||'–')}</td><td class="num">${h===null?'–':(h>7?`<span class="pill ${h>14?'crit':'warn'}">${h}</span>`:h)}</td></tr>`; }).join('')+'</tbody>'
    :`<tbody><tr><td class="empty">${esc(t('noBat'))}</td></tr></tbody>`;
}
function renderPromo(){
  const keys=['Hebahan_Pencegahan','Edaran_Risalah','Nasihat_Individu','Perbincangan_Kumpulan_Kecil','Hebahan_Kawalan_Semburan_Kabus','Media_Luar_Banner_Video_Media_Sosial','Ceramah_Taklimat','Gotong_Royong'];
  const pr=D.promosi.filter(r=>inRange(r.Tarikh_Laporan)); const days=pr.filter(r=>keys.some(k=>(num(r[k])||0)>0)).length;
  $('promoGrid').innerHTML=`<div class="stat"><div class="v">${days}/${pr.length}</div><div class="l">${esc(t('promoDays'))}</div></div>`+keys.map(k=>`<div class="stat"><div class="v">${sum(pr.map(r=>r[k]))}</div><div class="l">${esc(t('pr_'+k))}</div></div>`).join('');
}
function renderIssues(){
  const sv={Tinggi:'crit',Sederhana:'warn',Rendah:'info'};
  const is=D.isu.filter(i=>S.sev==='all'||i.Keterukan===S.sev);
  $('issues').innerHTML=is.map(i=>`<div class="issue"><span class="pill ${sv[i.Keterukan]||'info'}">${esc(dv(i.Keterukan)||'–')}</span><div class="t">${esc(i.Isu)}</div><div class="d">${esc(i.Butiran)}</div><div class="w">${esc(i.Sheet)} · ${esc(i.Tarikh)}</div></div>`).join('')||`<div class="empty">${esc(t('noIssues'))}</div>`;
}
function renderRange(){ paintSlider(); renderKPIs(); renderNotif(); renderOutbreaks(); renderVector(); renderLogistik(); renderBAT(); renderPromo(); }
function renderEverything(){ applyStatic(); buildWeekSel(); fillDiseaseSel(); fillUnitSel(); fillSevSel(); fillIdxSel(); showSource(); renderRange(); renderIssues(); }
function rerenderCharts(){ if(!D||!$('landing').hidden) return; renderNotif(); renderVector(); renderBAT(); renderStockTrend(); }

/* ================= boot ================= */
showDash(false); applyStatic(); renderLanding();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rerenderCharts); }catch(e){}
new MutationObserver(rerenderCharts).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.__cprc = {buildData, setData};
})();
</script>
